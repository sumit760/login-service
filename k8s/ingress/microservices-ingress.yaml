apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: microservices
  labels:
    app: microservices-crud
    component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  rules:
  - host: microservices.local
    http:
      paths:
      # User Service Routes
      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8083
      - path: /api/v1/login
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8083
      - path: /api/v1/register
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8083
      # Product Service Routes
      - path: /api/v1/products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8081
      # Eureka Server Route
      - path: /eureka
        pathType: Prefix
        backend:
          service:
            name: eureka-server
            port:
              number: 8761
      # Health Check Routes
      - path: /health/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8083
      - path: /health/products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-swagger-ingress
  namespace: microservices
  labels:
    app: microservices-crud
    component: swagger
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - host: microservices.local
    http:
      paths:
      # User Service Swagger
      - path: /swagger/users(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8083
      # Product Service Swagger
      - path: /swagger/products(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8081

