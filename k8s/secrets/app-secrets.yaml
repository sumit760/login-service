apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: microservices
  labels:
    app: microservices-crud
    component: secrets
type: Opaque
data:
  # JWT_SECRET: base64 encoded value of "myVerySecureJWTSecretKeyForProduction123!"
  JWT_SECRET: bXlWZXJ5U2VjdXJlSldUU2VjcmV0S2V5Rm9yUHJvZHVjdGlvbjEyMyE=
  # DB_PASSWORD: base64 encoded value of "password"
  DB_PASSWORD: cGFzc3dvcmQ=
  # ADMIN_PASSWORD: base64 encoded value of "admin123"
  ADMIN_PASSWORD: YWRtaW4xMjM=
---
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: microservices
  labels:
    app: microservices-crud
    component: database
type: Opaque
data:
  # For future PostgreSQL/MySQL integration
  # POSTGRES_USER: base64 encoded value of "microservices_user"
  POSTGRES_USER: bWljcm9zZXJ2aWNlc191c2Vy
  # POSTGRES_PASSWORD: base64 encoded value of "secure_password_123"
  POSTGRES_PASSWORD: c2VjdXJlX3Bhc3N3b3JkXzEyMw==
  # POSTGRES_DB: base64 encoded value of "microservices_db"
  POSTGRES_DB: bWljcm9zZXJ2aWNlc19kYg==

