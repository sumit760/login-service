apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: microservices
  labels:
    app: eureka-server
    component: discovery
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8761"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
  - port: 8761
    targetPort: 8761
    protocol: TCP
    name: http
  selector:
    app: eureka-server

