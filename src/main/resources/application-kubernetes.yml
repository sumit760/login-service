server:
  port: 8083

spring:
  application:
    name: user-service
  
  profiles:
    active: kubernetes
  
  datasource:
    url: jdbc:h2:mem:userdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DB_PASSWORD:password}
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka-server:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:user-service}
    instance-id: ${spring.application.name}:${HOSTNAME:user-service}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      sla:
        http.server.requests: 100ms, 200ms, 500ms

logging:
  level:
    com.example.login: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  file:
    name: /app/logs/user-service.log
    max-size: 100MB
    max-history: 30

jwt:
  secret: ${JWT_SECRET:myVerySecureJWTSecretKeyForProduction123!}
  expiration: 86400000 # 24 hours

# Kubernetes specific configurations
kubernetes:
  namespace: microservices
  service:
    name: user-service
  
# Actuator info
info:
  app:
    name: ${spring.application.name}
    description: User Service for Microservices CRUD Application
    version: 1.0.0
    encoding: ${file.encoding}
    java:
      version: ${java.version}
  kubernetes:
    namespace: ${kubernetes.namespace:microservices}
    pod: ${HOSTNAME:unknown}
    service: ${kubernetes.service.name:user-service}

